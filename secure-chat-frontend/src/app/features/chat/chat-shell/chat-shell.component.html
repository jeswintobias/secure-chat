<div class="chat-layout">
  <!-- Column 1: Slim Utility Bar (WhatsApp-style) -->
  <nav class="utility-bar">
    <div class="utility-top">
      <!-- Chats -->
      <button class="util-btn active" title="Chats" id="util-chats">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/>
          <path d="M7 9h10v2H7zm0-3h10v2H7zm0 6h7v2H7z"/>
        </svg>
      </button>

      <!-- Status -->
      <button class="util-btn" title="Status" id="util-status">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
      </button>

      <!-- Communities -->
      <button class="util-btn" title="Communities" id="util-communities">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
        </svg>
      </button>

      <!-- Channels -->
      <button class="util-btn" title="Channels" id="util-channels">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12zM6 10h2v2H6zm0 4h8v2H6zm10 0h2v2h-2zm-6-4h8v2h-8z"/>
        </svg>
      </button>

      <!-- Menu (3-dots) -->
      <button class="util-btn" title="Menu" id="util-menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
        </svg>
      </button>
    </div>

    <div class="utility-bottom">
      <!-- Settings -->
      <button class="util-btn" title="Settings" id="util-settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
      </button>

      <!-- User Profile Avatar -->
      <div class="util-avatar" [title]="currentUsername">
        {{ currentUsername.charAt(0).toUpperCase() }}
      </div>
    </div>
  </nav>

  <!-- Column 2: Sidebar / Conversation List -->
  <app-chat-sidebar
    [conversations]="groups"
    [activeConversationId]="activeConversation?.id ?? ''"
    [currentUsername]="currentUsername"
    (conversationSelected)="onConversationSelected($event)"
    (groupCreated)="onGroupCreated($event)"
    (groupJoined)="onGroupJoined($event)"
    (connectionAccepted)="onConnectionAccepted($event)"
  ></app-chat-sidebar>

  <!-- Column 3: Main Chat Panel -->
  <main class="chat-main">
    @if (activeConversation) {
      <app-chat-header
        [conversation]="activeConversation"
        [typingUsers]="typingUsers"
        [pinnedMessages]="pinnedMessages"
      ></app-chat-header>

      <app-message-window
        [messages]="messages"
        [currentUsername]="currentUsername"
        [isAdmin]="isAdmin"
        (pinMessage)="onPinMessage($event)"
        (unpinMessage)="onUnpinMessage($event)"
      ></app-message-window>

      <!-- WebSocket Error Toast (URL security blocks, etc.) -->
      @if (wsError) {
        <div class="ws-error-toast">
          <span class="ws-error-message">{{ wsError }}</span>
          <button class="ws-error-dismiss" (click)="dismissWsError()" title="Dismiss">&times;</button>
        </div>
      }

      <app-message-input
        (messageSent)="onMessageSent($event)"
        (typingChanged)="onTypingChanged($event)"
      ></app-message-input>
    } @else {
      <app-empty-state></app-empty-state>
    }
  </main>
</div>
