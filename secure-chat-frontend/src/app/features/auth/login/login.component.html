<div class="auth-page">
  <div class="auth-backdrop"></div>
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="24" r="24" fill="var(--accent-primary)" opacity="0.15"/>
          <path d="M24 8C15.16 8 8 14.72 8 23c0 2.84.84 5.48 2.28 7.72L8 40l9.64-2.52C19.72 38.48 21.8 39 24 39c8.84 0 16-6.72 16-15S32.84 8 24 8z" fill="var(--accent-primary)"/>
          <path d="M32 27.4c-.44-.2-2.56-1.24-2.96-1.4-.4-.12-.68-.2-.96.2-.28.4-1.08 1.4-1.32 1.68-.24.28-.48.32-.92.12-.44-.2-1.84-.68-3.52-2.16-1.3-1.16-2.18-2.6-2.44-3.04-.24-.44-.02-.68.18-.88.2-.2.44-.48.64-.72.2-.24.28-.4.4-.68.12-.28.06-.52-.02-.72-.1-.2-.96-2.32-1.32-3.16-.36-.84-.72-.72-.96-.72h-.84c-.28 0-.72.08-1.08.44-.36.36-1.4 1.36-1.4 3.32s1.44 3.86 1.64 4.12c.2.28 2.84 4.32 6.88 6.06.96.4 1.72.68 2.32.84.96.32 1.84.28 2.52.16.76-.12 2.56-1.04 2.92-2.04.36-1 .36-1.84.24-2.04-.12-.16-.4-.28-.84-.48z" fill="white"/>
        </svg>
      </div>
      <h1 class="auth-title">Secure Chat</h1>
      <p class="auth-subtitle">Sign in to continue to your messages</p>
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="login-username" class="form-label">Username</label>
        <input
          id="login-username"
          type="text"
          class="form-input"
          [(ngModel)]="username"
          name="username"
          placeholder="Enter your username"
          autocomplete="username"
          required
          minlength="3"
          maxlength="50"
        />
      </div>

      <div class="form-group">
        <label for="login-password" class="form-label">Password</label>
        <input
          id="login-password"
          type="password"
          class="form-input"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        />
      </div>

      @if (errorMessage) {
        <div class="form-error" role="alert">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zM7 4h2v5H7V4zm0 6h2v2H7v-2z"/>
          </svg>
          {{ errorMessage }}
        </div>
      }

      <button
        id="login-submit"
        type="submit"
        class="btn-primary"
        [disabled]="isLoading || !username.trim() || !password.trim()"
      >
        @if (isLoading) {
          <span class="spinner"></span>
          Signing in...
        } @else {
          Sign In
        }
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/auth/register">Create one</a></p>
    </div>
  </div>
</div>
