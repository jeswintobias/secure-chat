# ============================================================
# Secure Chat System — Application Configuration
# ============================================================

spring:
  application:
    name: secure-chat-system

  # -------------------- PostgreSQL Datasource --------------------
  datasource:
    url: jdbc:postgresql://localhost:5432/securechat
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # -------------------- JPA / Hibernate --------------------
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # -------------------- SQL Init (schema bootstrap) --------------------
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# ============================================================
# JWT Configuration
# ============================================================
app:
  jwt:
    secret: ${JWT_SECRET:c2VjdXJlQ2hhdFN5c3RlbURldmVsb3BtZW50U2VjcmV0S2V5VGhhdElzTG9uZ0Vub3VnaEZvckhNQUNTSEEyNTY=}
    expiration-ms: 86400000  # 24 hours

  # -------------------- WebSocket --------------------
  # Use * in dev so any dynamically-assigned Angular port works.
  # Override via WS_ALLOWED_ORIGINS env var in production.
  websocket:
    allowed-origins: ${WS_ALLOWED_ORIGINS:*}

  # -------------------- URL Security Pipeline --------------------
  security:
    url-validation:
      enabled: true
      timeout-seconds: 3
      max-redirects: 3
      blocked-extensions: .exe,.bat,.cmd,.scr,.msi,.ps1,.vbs,.dll,.com,.jar,.sh
      blocked-mime-types: application/x-msdownload,application/x-executable,application/x-msdos-program,application/x-dosexec
    safe-browsing-api-key: ${SAFE_BROWSING_API_KEY:}

  # -------------------- CORS --------------------
  # Use * in dev so any dynamically-assigned Angular port works.
  # Override via CORS_ALLOWED_ORIGINS env var in production.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# ============================================================
# Logging
# ============================================================
logging:
  level:
    root: INFO
    com.securechat: DEBUG
    org.springframework.web.socket: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# ============================================================
# Server
# ============================================================
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
