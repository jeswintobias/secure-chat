# ============================================================
# Secure Chat System — CI/CD Pipeline
# ============================================================
# Runs backend (Maven/JUnit) and frontend (Angular/Karma) tests
# on every push and pull request targeting the main branch.

name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ────────────────────────────────────────────────────────────
  # Backend: Spring Boot 3.3 + Java 21
  # ────────────────────────────────────────────────────────────
  backend:
    name: Backend Tests (Java 21 + Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secure-chat-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run unit & integration tests
        run: mvn test -Dspring.profiles.active=test --batch-mode --no-transfer-progress

  # ────────────────────────────────────────────────────────────
  # Frontend: Angular 19 + Karma/Jasmine
  # ────────────────────────────────────────────────────────────
  frontend:
    name: Frontend Build & Test (Angular 19)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secure-chat-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: secure-chat-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npx ng build --configuration=production

      - name: Run unit tests
        run: npx ng test --browsers=ChromeHeadless --watch=false
